<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Navidad 2026 | Lobo de Sistemas UNIFRANZ</title>
<style>
:root{--azul:#061a36;--naranja:#f97316;--celeste:#0e6ba8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 10%,#123f7a,transparent 50%),radial-gradient(circle at 85% 90%,#0a3d6b,transparent 50%),var(--azul);color:#fff;font-family:Segoe UI,Arial,sans-serif;display:grid;place-items:center;overflow-x:hidden}canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}.tarjeta{position:relative;width:min(92%,650px);margin:35px auto;padding:36px 25px;text-align:center;background:rgba(7,32,65,.9);border:2px solid var(--naranja);border-radius:25px;box-shadow:0 0 40px #f9731640;animation:entrada 1s ease}.lobo{font-size:72px;animation:flotar 3s ease-in-out infinite}h1{font-size:clamp(28px,6vw,46px);color:#ffb26c;margin:12px 0}h2{font-size:clamp(18px,4vw,25px);margin:8px 0}.uni{display:inline-block;background:var(--naranja);padding:8px 25px;border-radius:20px;font-weight:800;letter-spacing:3px}.texto{color:#d6eafa;line-height:1.6}.enlaces{display:grid;gap:14px;margin:26px 0}.enlaces a{display:block;background:linear-gradient(100deg,#0e6ba8,#f97316);color:#fff;text-decoration:none;padding:15px;border-radius:14px;font-weight:750;transition:transform .2s,box-shadow .2s}.enlaces a:hover,.enlaces a:focus-visible{transform:translateY(-3px);box-shadow:0 5px 20px #f9731680}.pie{font-size:13px;color:#bdd4e7;border-top:1px solid #f9731680;padding-top:18px}@keyframes entrada{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@keyframes flotar{50%{transform:translateY(-10px)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<canvas id="nieve" aria-hidden="true"></canvas>
<main class="tarjeta">
<div class="lobo" aria-hidden="true">🐺🎅</div>
<h2>LOBO DE SISTEMAS</h2><span class="uni">UNIFRANZ</span>
<h1>🎄 ¡Feliz Navidad! 🎄</h1>
<p class="texto">Un detalle especial de los estudiantes de Ingeniería de Sistemas para nuestros ingenieros.</p>
<div class="enlaces">
<a href="ingeniero1.html">🎁 Felicitación del Ingeniero 1</a>
<a href="ingeniero2.html">🎁 Felicitación del Ingeniero 2</a>
<a href="ingeniero3.html">🎁 Felicitación del Ingeniero 3</a>
</div>
<p class="pie">Con cariño, sus estudiantes · Navidad 2026</p>
</main>
<script>
const cv=document.getElementById('nieve'),ctx=cv.getContext('2d');let copos=[];
function ajustar(){cv.width=innerWidth;cv.height=innerHeight;copos=Array.from({length:Math.min(110,Math.floor(innerWidth/12))},()=>({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*2.5+1,v:Math.random()+.4}))}
function animar(){ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='rgba(255,255,255,.75)';for(const c of copos){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill();c.y+=c.v;if(c.y>cv.height)c.y=-5}requestAnimationFrame(animar)}
addEventListener('resize',ajustar);ajustar();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)animar();
</script>
</body>
</html>
